# Phase 0.5 Codex Integration Spike — compile-verification harness.
# Points at the PINNED local checkout of openai/codex (rev f3f6922519fa38487c8250c2b8a670a39a2cf9ff).
# Production usage (if adopted) would be:
#   codex-model-provider-info = { git = "ssh://git@github.com/openai/codex.git", rev = "f3f69225..." }
[package]
name = "codex-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
codex-model-provider-info = { path = "/tmp/codex/codex-rs/model-provider-info" }
codex-protocol = { path = "/tmp/codex/codex-rs/protocol" }

[workspace]

# replicated from openai/codex@f3f69225 [patch.crates-io] — required for codex-api resolution
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
